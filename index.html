<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生日快樂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: a warm, glowing night party — generous, joyful, a little magical
   IDEA: the moment the lights go down and the cake comes out, candles lighting the room
   PICTURE: a two-tier strawberry cake on a gold stand, real flickering candles, a gift that bursts open, string lights, balloons, fireworks
   COLOUR and TYPE: deep rose-wine night, candle gold, frosting pink, mint accent; Pacifico script + Chiron GoRound TC
   LAYOUT: garlands across the top, name as a poster, cake centre stage, three big buttons, glass message card */
:root{color-scheme:dark;--night:#1c0714;--wine:#3a0f25;--cream:#fff1e6;--soft:#f3c9d6;--gold:#ffd27a;--pink:#ff7aa2;--teal:#6fe3d0;
  --cn:"Chiron GoRound TC","Noto Sans TC",system-ui,sans-serif}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{min-height:100vh;background:radial-gradient(ellipse 120% 90% at 50% 62%,#7a2442 0%,var(--wine) 45%,var(--night) 100%) fixed;color:var(--cream);font:16px/1.6 var(--cn);overflow-x:clip;-webkit-tap-highlight-color:transparent}
canvas.layer{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#sky{z-index:0}#fx{z-index:6}
#balloons{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.balloon{position:absolute;bottom:-230px;pointer-events:auto;cursor:pointer;animation:rise linear forwards}
.balloon>div{animation:sway 3.2s ease-in-out infinite alternate;transform-origin:50% 100%}
.balloon svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 8px 14px #0005)}
@keyframes rise{to{transform:translateY(calc(-100vh - 360px))}}
@keyframes sway{from{transform:rotate(-7deg) translateX(-10px)}to{transform:rotate(7deg) translateX(10px)}}
#lights{position:absolute;top:0;left:0;width:100%;z-index:2;pointer-events:none;overflow:visible}
.bulb{transition:opacity .25s;transition-delay:var(--o)}
body.dark .bulb,body.off .bulb{opacity:.07;transition-delay:0s}
.bulb .gl{animation:tw 1.8s ease-in-out infinite alternate;animation-delay:var(--d);transform-box:fill-box;transform-origin:center}
.bulb.hit .gl{animation:none;opacity:1;transform:scale(1.7)}
@keyframes tw{from{opacity:.3}to{opacity:1}}
.flag{transform-box:fill-box;transform-origin:50% 0;animation:swing 2.8s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes swing{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
#dim{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,#0a0206b0,#050003ee);opacity:0;transition:opacity .9s}
body.dark #dim{opacity:1}
main{position:relative;z-index:3;pointer-events:none;max-width:900px;margin:0 auto;padding:clamp(72px,8vw,110px) max(5vw,16px) 40px;text-align:center}
.live{pointer-events:auto}
.script{font:400 clamp(24px,4.4vw,38px)/1.2 Pacifico,cursive;color:var(--gold);margin:0;text-shadow:0 0 18px #ffb34799;transform:rotate(-4deg)}
h1{margin:4px 0 0;line-height:1.05;font-weight:900}
.nm{display:block;font-size:clamp(52px,10vw,92px);letter-spacing:.03em;filter:drop-shadow(0 0 22px #ff9a5a77) drop-shadow(0 5px 0 #5a1530)}
.ch{display:inline-block;background:linear-gradient(100deg,#ffd27a 0%,#fff6d8 20%,#ff9ab8 42%,#ffd27a 62%,#fff6d8 80%,#ffd27a 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:drop .9s cubic-bezier(.3,1.6,.5,1) backwards,wave 2.6s ease-in-out infinite,shine 4.5s linear infinite;
  animation-delay:calc(var(--i)*.09s),calc(1s + var(--i)*.18s),calc(var(--i)*.22s)}
@keyframes drop{from{transform:translateY(-80px) scale(.4) rotate(-20deg);opacity:0}}
@keyframes wave{0%,100%{transform:none}25%{transform:translateY(-12px) rotate(-4deg)}75%{transform:translateY(4px) rotate(3deg)}}
@keyframes shine{from{background-position:100% 0}to{background-position:-160% 0}}
.sub{display:block;font-size:clamp(28px,5.4vw,44px);margin-top:8px;letter-spacing:.1em;text-shadow:0 3px 0 #5a1530,0 0 24px #ff7aa266}
.lead{margin:8px 0 0;color:var(--soft);font-size:16px}
.stage{position:relative;margin:4px auto 0;max-width:min(500px,60vh)}
.stage svg{display:block;width:100%;height:auto;overflow:visible}
#cake,#giftWrap{cursor:pointer;outline:none}
#scene .lightdep{transition:opacity .8s}
#scene.out .lightdep{opacity:0}
.fl{animation:flick var(--fd) ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{0%{transform:none}50%{transform:scale(.9,1.1) skewX(5deg)}100%{transform:scale(1.05,.93) skewX(-5deg)}}
.flame{transition:opacity .3s,transform .35s;transform-box:fill-box;transform-origin:50% 100%}
.flame.out{opacity:0;transform:scale(.1)}
.fglow{animation:gp 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center;transition:opacity .4s}
.fglow.out{opacity:0}
@keyframes gp{to{transform:scale(1.18)}}
.smoke{fill:none;stroke:#e9dce4;stroke-width:2.4;stroke-linecap:round;opacity:0;stroke-dasharray:80;stroke-dashoffset:80}
.smoke.on{animation:smoke 2.2s ease-out forwards}
@keyframes smoke{0%{opacity:.9;stroke-dashoffset:80;transform:none}60%{opacity:.5}100%{opacity:0;stroke-dashoffset:0;transform:translateY(-36px)}}
.spk{transform-box:fill-box;transform-origin:center;animation:spk 2.4s ease-in-out infinite;animation-delay:var(--d)}
@keyframes spk{0%,100%{transform:scale(0);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}
.gift{transform-box:fill-box;transform-origin:50% 100%}
.gift.shake{animation:shake .6s ease-in-out}
@keyframes shake{20%{transform:rotate(-8deg) translateY(-4px)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg) translateY(-2px)}80%{transform:rotate(3deg)}}
.lid{transition:transform .45s ease-in;transform-box:fill-box;transform-origin:20% 100%}
#giftWrap.open .lid{transform:translate(-44px,-100px) rotate(-34deg);transition:transform .9s cubic-bezier(.2,1.5,.4,1)}
.rays{opacity:0;transition:opacity .6s;transform-box:fill-box;transform-origin:center}
#giftWrap.open .rays{opacity:1;animation:spin 10s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.inglow{opacity:0;transition:opacity .4s}#giftWrap.open .inglow{opacity:1}
.btns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:6px}
.b{--c1:#ff9dbc;--c2:#e0507e;--sh:#8f2347;position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:0 26px 0 20px;border:0;border-radius:999px;cursor:pointer;font:900 18px/1 var(--cn);color:#fff;background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 6px 0 var(--sh),0 14px 28px #0007,inset 0 2px 0 #fff7;transition:transform .12s,box-shadow .12s,filter .2s}
.b::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#fff9 50%,transparent 70%);transform:translateX(-120%)}
.b:hover::after{transform:translateX(120%);transition:transform .7s}
.b:hover{filter:brightness(1.08);transform:translateY(-2px)}
.b:active{transform:translateY(5px);box-shadow:0 1px 0 var(--sh),0 4px 10px #0007,inset 0 2px 0 #fff7}
.b:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.b svg{width:24px;height:24px;flex:none}
.b.gold{--c1:#ffe08a;--c2:#ffb347;--sh:#a8651a;color:#4a1a10}
.b.teal{--c1:#9af3e3;--c2:#33bfa8;--sh:#1d6f62;color:#0f3b35}
.b.pulse{animation:glowp 1.5s ease-in-out infinite}
@keyframes glowp{50%{filter:brightness(1.15) drop-shadow(0 0 16px var(--c1))}}
.card{margin:24px auto 0;max-width:560px;padding:22px 26px;border-radius:24px;background:linear-gradient(180deg,#ffffff1f,#ffffff0a);border:1px solid #ffffff30;box-shadow:0 20px 50px #0008,inset 0 1px 0 #ffffff40;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);min-height:124px;display:grid;place-items:center;perspective:800px}
.card .in{animation:flipin .6s cubic-bezier(.2,1.3,.4,1)}
@keyframes flipin{from{transform:rotateX(75deg) translateY(10px);opacity:0}}
.card .big{font-weight:900;font-size:clamp(22px,4vw,28px);line-height:1.25;color:var(--gold);margin:0 0 6px;text-wrap:balance}
.card p{margin:0;font-size:17px;text-wrap:pretty}
.lyr .ln{font-size:clamp(20px,4.6vw,28px);font-weight:900;opacity:.32;transition:opacity .2s;margin:2px 0;letter-spacing:.06em}
.lyr .ln.on{opacity:1}
.tk{display:inline-block;transition:color .15s,transform .15s,text-shadow .15s}
.tk.done{color:var(--gold)}
.tk.nm2{color:var(--pink)}
.tk.now{color:#fff;transform:translateY(-6px) scale(1.3);text-shadow:0 0 18px var(--gold)}
.meta{margin:14px 0 0;font-size:14px;color:var(--soft);min-height:1.6em}
.hint{margin:4px 0 0;font-size:13px;color:#f3c9d6aa}
footer{margin:30px auto 0;font-size:14px;color:var(--soft)}
footer input{font:500 16px var(--cn);color:var(--cream);background:#ffffff14;border:1px solid #ffffff38;border-radius:999px;padding:9px 16px;width:11em;margin-inline-start:8px;text-align:center}
footer input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.snd{position:fixed;top:12px;right:12px;z-index:8;width:46px;height:46px;border-radius:50%;border:1px solid #ffffff38;background:#0005;color:var(--cream);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;cursor:pointer}
.snd svg{width:22px;height:22px}
.snd:focus-visible{outline:2px solid var(--gold)}
.lock{display:none;min-height:66vh;place-content:center;justify-items:center;padding-top:4vh}
body[data-s=lock] .lock{display:grid;animation:up 1s ease both}
body[data-s=lock] .head,body[data-s=lock] .stage,body[data-s=lock] .card,body[data-s=lock] .btns,body[data-s=lock] .intro{display:none}
#pw{margin-top:26px;width:7.5em;font:900 34px/1 var(--cn);letter-spacing:.45em;text-indent:.45em;text-align:center;color:var(--cream);background:#ffffff14;border:2px solid #ffffff40;border-radius:20px;padding:16px 10px}
#pw:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px #ffd27a33,0 0 30px #ffd27a44}
.lock.err #pw{animation:shake2 .45s;border-color:var(--pink)}
@keyframes shake2{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#pwMsg{min-height:1.6em}
.intro{display:none;min-height:58vh;place-content:center;padding-top:6vh}
.introT{font-weight:900;font-size:clamp(36px,8vw,60px);line-height:1.15;margin:14px 0 0;text-wrap:balance;text-shadow:0 4px 0 #5a1530,0 0 30px #ff7aa255}
body[data-s=intro] .intro{display:grid;animation:up 1.2s ease both}
body[data-s=intro] .head,body[data-s=intro] .stage,body[data-s=intro] .card{display:none}
.head,.stage,.card{animation:up 1s cubic-bezier(.2,.9,.3,1) both}
.stage{animation-delay:.3s}.card{animation-delay:.6s}
@keyframes up{from{opacity:0;transform:translateY(30px)}}
.btns{margin-top:22px}
.b{min-width:220px}
.b.wait{visibility:hidden}
#cake,#giftWrap{cursor:default}
body[data-s=wish] #cake,body[data-s=gift] #giftWrap{cursor:pointer}
#giftWrap.hl #gift{animation:hop 1.1s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-10px) rotate(-3deg)}}
.letter .l{opacity:0;margin:10px 0 0;animation:lineIn .9s ease forwards;animation-delay:var(--d)}
.bar{height:6px;max-width:260px;margin:18px auto 4px;border-radius:9px;background:#ffffff22;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--gold),var(--pink));animation:fill linear forwards}
@keyframes fill{to{width:100%}}
.slot{margin:14px auto 4px;max-width:420px;padding:16px 18px;border-radius:18px;border:2px dashed #ffd27a88;background:#00000033;font-weight:900;font-size:clamp(20px,4.6vw,28px);line-height:1.3;min-height:76px;display:grid;place-items:center;overflow:hidden}
.slot span{display:block}
.slot span.pop{animation:slotIn .12s ease-out}
@keyframes slotIn{from{transform:translateY(-60%);opacity:.2}}
.slot.won{border:2px solid var(--gold);color:var(--gold);box-shadow:0 0 30px #ffd27a66,inset 0 0 20px #ffd27a33;animation:winPulse 1.2s ease-in-out infinite alternate}
@keyframes winPulse{to{box-shadow:0 0 50px #ffd27aaa,inset 0 0 26px #ffd27a55}}
.note{margin-top:10px!important;font-size:14px!important;color:var(--soft)}
@keyframes lineIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.letter .sign{font-weight:900;font-size:24px;color:var(--pink)}
@media(max-width:520px){.b{flex:1 1 100%}.card{padding:18px}}
@media(prefers-reduced-motion:reduce){.ch,.fl,.fglow,.flag,.bulb .gl,.spk,.balloon>div,.b.pulse{animation:none}}
</style>
</head>
<body>
<canvas id="sky" class="layer"></canvas>
<div id="balloons"></div>
<svg id="lights" aria-hidden="true"></svg>
<button class="snd live" id="snd" aria-label="音效開關"></button>

<main>
  <section class="lock live" id="lock">
    <p class="script">Shh...</p>
    <p class="introT">先輸入密碼<br>才能進來喔</p>
    <input id="pw" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="密碼">
    <p class="lead" id="pwMsg">提示：今天是幾月幾號？</p>
  </section>
  <section class="intro" id="intro">
    <p class="script">For you</p>
    <p class="introT">今天是<br>你的大日子欸！</p>
    <p class="lead">我偷偷準備了一個小驚喜給你</p>
  </section>
  <header class="head">
    <p class="script">Happy Birthday</p>
    <h1><span class="nm" id="nm"></span><span class="sub">生日快樂！</span></h1>
    <p class="lead">今天你最大，什麼都你說了算！</p>
  </header>

  <div class="stage live">
  <svg id="scene" viewBox="0 0 520 440" role="img" aria-label="雙層草莓生日蛋糕">
    <defs>
      <radialGradient id="warm"><stop offset="0" stop-color="#ffcf7a" stop-opacity=".55"/><stop offset=".45" stop-color="#ff8a5a" stop-opacity=".16"/><stop offset="1" stop-color="#ff8a5a" stop-opacity="0"/></radialGradient>
      <radialGradient id="warm2"><stop offset="0" stop-color="#fff2c0" stop-opacity=".65"/><stop offset="1" stop-color="#fff2c0" stop-opacity="0"/></radialGradient>
      <radialGradient id="fgG"><stop offset="0" stop-color="#ffe7a0" stop-opacity=".95"/><stop offset=".35" stop-color="#ffb347" stop-opacity=".35"/><stop offset="1" stop-color="#ff8a3c" stop-opacity="0"/></radialGradient>
      <radialGradient id="shadowG"><stop offset="0" stop-color="#000" stop-opacity=".5"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
      <radialGradient id="rayG" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="180"><stop offset="0" stop-color="#fff6cc" stop-opacity=".85"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
      <linearGradient id="pinkSide"><stop offset="0" stop-color="#ffc4d6"/><stop offset=".3" stop-color="#ff9dbc"/><stop offset=".75" stop-color="#e8628f"/><stop offset="1" stop-color="#b8406a"/></linearGradient>
      <linearGradient id="creamSide"><stop offset="0" stop-color="#fffaf3"/><stop offset=".3" stop-color="#fff0dd"/><stop offset=".75" stop-color="#efcfae"/><stop offset="1" stop-color="#cfa27c"/></linearGradient>
      <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3b8"/><stop offset=".45" stop-color="#ffcf5a"/><stop offset=".7" stop-color="#c98d1f"/><stop offset="1" stop-color="#ffe08a"/></linearGradient>
      <linearGradient id="standG"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".4" stop-color="#f5bf4e"/><stop offset=".8" stop-color="#b37a1c"/><stop offset="1" stop-color="#e8b44a"/></linearGradient>
      <linearGradient id="giftG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7aa6"/><stop offset="1" stop-color="#d83a72"/></linearGradient>
      <linearGradient id="tealG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fe8d6"/><stop offset="1" stop-color="#2fae99"/></linearGradient>
      <linearGradient id="icW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#ffe9f0"/></linearGradient>
      <linearGradient id="icP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffa6c3"/><stop offset="1" stop-color="#f2638f"/></linearGradient>
      <linearGradient id="berry" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4d5e"/><stop offset="1" stop-color="#c0142e"/></linearGradient>
      <pattern id="st0" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="10" height="10" fill="#fff"/><rect width="10" height="4" fill="#ff7aa2"/></pattern>
      <pattern id="st1" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="10" height="10" fill="#fff"/><rect width="10" height="4" fill="#4fd3bd"/></pattern>
      <pattern id="st2" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="10" height="10" fill="#fff"/><rect width="10" height="4" fill="#ffbf3d"/></pattern>
    </defs>
    <circle class="lightdep" cx="260" cy="110" r="260" fill="url(#warm)"/>
    <ellipse cx="260" cy="416" rx="250" ry="18" fill="url(#shadowG)"/>
    <g id="floor"></g>
    <!-- stand -->
    <path d="M244 386Q252 397 234 410H286Q268 397 276 386Z" fill="url(#standG)"/>
    <ellipse cx="260" cy="410" rx="56" ry="10" fill="url(#standG)"/>
    <ellipse cx="260" cy="369" rx="186" ry="22" fill="url(#standG)"/>
    <ellipse cx="260" cy="364" rx="180" ry="19" fill="#fff4e0"/>
    <g id="cake" role="button" aria-label="吹蠟燭">
      <ellipse cx="262" cy="362" rx="160" ry="22" fill="#000" opacity=".18"/>
      <path d="M110 240V356A150 24 0 0 0 410 356V240Z" fill="url(#pinkSide)"/>
      <rect x="124" y="292" width="8" height="66" rx="4" fill="#fff" opacity=".3"/>
      <g id="bdeco"></g>
      <g id="bpearls"></g>
      <ellipse cx="260" cy="240" rx="150" ry="24" fill="url(#icW)"/>
      <path id="bdrip" fill="#fffaf6"/>
      <g id="dback"></g>
      <ellipse cx="262" cy="247" rx="98" ry="17" fill="#c78a9a" opacity=".35"/>
      <path d="M168 150V244A92 15 0 0 0 352 244V150Z" fill="url(#creamSide)"/>
      <rect x="178" y="178" width="6" height="58" rx="3" fill="#fff" opacity=".45"/>
      <g id="tdeco"></g>
      <g id="tpearls"></g>
      <ellipse cx="260" cy="150" rx="92" ry="15" fill="url(#icP)"/>
      <path id="tdrip" fill="url(#icP)"/>
      <ellipse cx="236" cy="146" rx="34" ry="4" fill="#fff" opacity=".35"/>
      <g id="dfront"></g>
      <ellipse class="lightdep" cx="260" cy="148" rx="120" ry="34" fill="url(#warm2)"/>
      <g id="candles"></g>
      <g id="berries"></g>
    </g>
    <g id="spks"></g>
  </svg>
  </div>

  <div class="card live" id="card" aria-live="polite"><div class="in"></div></div>

  <div class="btns live">
    <button class="b gold pulse" id="next"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"></svg><span>按下開始</span></button>
  </div>
</main>

<div id="dim"></div>
<canvas id="fx" class="layer"></canvas>

<script>
{
const $=id=>document.getElementById(id);
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
const R=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLS=['#ffd27a','#ff7aa2','#6fe3d0','#fff1e6','#ff9a5a','#c9a0ff'];
const FW=['#ffd27a','#ff7aa2','#6fe3d0','#ff9a5a','#fff1e6','#c9a0ff','#ff4f7e'];
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const f1=n=>n.toFixed(1);

/* ---------- 壽星名字：改這裡 ---------- */
const NAME='好朋友';
const renderName=()=>{$('nm').innerHTML=[...NAME].map((c,i)=>`<span class="ch" style="--i:${i}">${esc(c)}</span>`).join('')};

/* ---------- cake scene ---------- */
function dripPath(cx,y,rx,ry,n,maxLen){
  let d=`M${cx-rx} ${y}A${rx} ${ry} 0 0 0 ${cx+rx} ${y}L${cx+rx} ${y+5}`;

function draw(p){const a=Math.min(1,p.life/p.max*1.4);switch(p.k){
  case'c':{const c=Math.cos(p.rot),s=Math.sin(p.rot),f=Math.cos(p.ph);fc.globalAlpha=Math.min(1,p.life/40);fc.fillStyle=p.col;fc.setTransform(DPR*c,DPR*s,-DPR*s*f,DPR*c*f,DPR*p.x,DPR*p.y);
    if(p.round){fc.beginPath();fc.arc(0,0,p.w/2.6,0,7);fc.fill()}else fc.fillRect(-p.w/2,-p.h/2,p.w,p.h);break}
  case'h':{const s=p.sz*1.7*DPR;fc.globalAlpha=a;fc.fillStyle=p.col;fc.setTransform(s,0,0,s,DPR*p.x,DPR*p.y);fc.fill(HEART);break}
  case's':{let al=p.life/p.max;if(p.tw&&Math.random()<.45)al*=.2;fc.globalAlpha=al;const sp=Math.abs(p.vx)+Math.abs(p.vy);
    if(sp>1.4){fc.strokeStyle=p.col;fc.lineWidth=p.r;fc.beginPath();fc.moveTo(p.x-p.vx*2.4,p.y-p.vy*2.4);fc.lineTo(p.x,p.y);fc.stroke()}else{fc.fillStyle=p.col;fc.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r)}break}
  case'st':{const s=p.sz/6*DPR,c=Math.cos(p.rot),n=Math.sin(p.rot);fc.globalAlpha=p.life/p.max;fc.fillStyle=p.col;fc.setTransform(s*c,s*n,-s*n,s*c,DPR*p.x,DPR*p.y);fc.fill(STAR);break}
  case'r':fc.globalAlpha=.35;fc.fillStyle='#ffd9a0';fc.beginPath();fc.arc(p.x,p.y,6,0,7);fc.fill();fc.globalAlpha=1;fc.fillStyle='#fff8e8';fc.beginPath();fc.arc(p.x,p.y,2.4,0,7);fc.fill();break;
  case'sh':{const g=fc.createLinearGradient(p.x,p.y,p.x-p.vx*14,p.y-p.vy*14);g.addColorStop(0,'#ffffffee');g.addColorStop(1,'#ffffff00');fc.globalAlpha=a;fc.strokeStyle=g;fc.lineWidth=3;fc.beginPath();fc.moveTo(p.x,p.y);fc.lineTo(p.x-p.vx*14,p.y-p.vy*14);fc.stroke();fc.fillStyle='#fff';fc.beginPath();fc.arc(p.x,p.y,3.2,0,7);fc.fill();break}
  case'f':{const g=fc.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,p.col+'aa');g.addColorStop(1,p.col+'00');fc.globalAlpha=p.life/p.max*.7;fc.fillStyle=g;fc.beginPath();fc.arc(p.x,p.y,p.r,0,7);fc.fill();break}
}}
let dark=false,darkA=0;
function step(t){
  fc.setTransform(DPR,0,0,DPR,0,0);fc.globalAlpha=1;fc.globalCompositeOperation='source-over';fc.clearRect(0,0,W,H);
  for(let i=P.length-1;i>=0;i--){const p=P[i];upd(p);if(p.life<=0||p.y>H+80||p.y<-H){P[i]=P[P.length-1];P.pop()}}
  darkA+=((dark?1:0)-darkA)*.05;
  if(darkA>.02){fc.globalCompositeOperation='lighter';fc.fillStyle='#fff6e6';for(const s of stars){fc.globalAlpha=darkA*s.o*(.4+.6*Math.abs(Math.sin(t*s.sp*2+s.ph)));fc.beginPath();fc.arc(s.x,s.y,s.r*1.4,0,7);fc.fill()}fc.globalCompositeOperation='source-over'}
  for(const p of P)if(p.k==='c'||p.k==='h'){draw(p);fc.setTransform(DPR,0,0,DPR,0,0)}
  fc.globalCompositeOperation='lighter';
  for(const p of P)if(p.k!=='c'&&p.k!=='h'){draw(p);fc.setTransform(DPR,0,0,DPR,0,0)}
  fc.globalAlpha=1;fc.globalCompositeOperation='source-over';
}
function frame(t){drawSky(t);step(t);requestAnimationFrame(frame)}

/* ---------- flow: one screen at a time ---------- */
const card=$('card'),next=$('next'),body=document.body;
const show=h=>{card.innerHTML=`<div class="in">${h}</div>`;const r=card.getBoundingClientRect();if(r.bottom>innerHeight)card.scrollIntoView({behavior:calm?'auto':'smooth',block:'nearest'})};
const center=el=>{const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};
const ICONS={
  music:'<path d="M9 18.5a3 3 0 1 1-2-2.83V5l12-2v12.5a3 3 0 1 1-2-2.83V7.2L9 8.6z"/>',
  candle:'<path d="M12 1.5c2.2 2.6 2.8 4.2 2.8 5.3a2.8 2.8 0 0 1-5.6 0c0-1.1.6-2.7 2.8-5.3z"/><rect x="9" y="11.5" width="6" height="11" rx="1.5" opacity=".85"/>',
  gift:'<rect x="3" y="8.5" width="18" height="4.5" rx="1"/><rect x="4.5" y="13" width="15" height="8.5" rx="1"/><path d="M12 8.5C9 8.5 5.6 7.6 6.3 5 7 2.6 10.2 4.4 12 8.5zm0 0c3 0 6.4-.9 5.7-3.5C17 2.6 13.8 4.4 12 8.5z"/>',
  arrow:'<path d="M4 11h12.2l-4.6-4.6L13 5l7 7-7 7-1.4-1.4 4.6-4.6H4z"/>'};
const STYLE={music:['teal'],candle:['gold'],gift:[],arrow:['gold']};
let onNext=null;
function step2(label,icon,fn){
  next.className='b pulse '+(STYLE[icon]||[]).join(' ');
  next.querySelector('.ic').innerHTML=ICONS[icon];next.querySelector('span').textContent=label;onNext=fn;
}
const wait=()=>{onNext=null;next.className='b wait'};
next.addEventListener('click',()=>{if(!onNext)return;const f=onNext;wait();f()});

/* screen 1: song + fireworks (traditional "Happy Birthday" melody) */
const N={G4:392,A4:440,B4:494,C5:523,D5:587,E5:659,F5:698,G5:784};
const SONG=[['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
  ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',3]];
const BEAT=.42;
function start(){
  body.dataset.s='party';body.classList.remove('off');renderName();sChime();show('<p class="big">先把聲音打開喔！</p><p>音樂要來囉～</p>');
  setTimeout(()=>{rain(160);song()},1400);
}
function song(){
  const L=['祝','你','生','日','快','樂'],lines=[L,L,['祝','福',NAME,'生','日','快','樂'],L],map=[];
  lines.forEach((l,li)=>l.forEach((t,ti)=>map.push([li,ti])));
  show(`<div class="lyr">${lines.map((l,li)=>`<p class="ln" id="ln${li}">${l.map((t,ti)=>`<span class="tk${li===2&&ti===2?' nm2':''}" id="tk${li}-${ti}">${esc(t)}</span>`).join('')}</p>`).join('')}</div>`);
  const a=audio(),t0=a?a.currentTime+.08:0;let acc=0;
  SONG.forEach(([k,d],i)=>{if(a)tone(N[k],t0+acc,d*BEAT);const at=acc;setTimeout(()=>onNote(i,d,map),at*1000+80);acc+=d*BEAT});
  setTimeout(finale,acc*1000+350);
}
function onNote(i,d,map){
  const[li,ti]=map[i];
  card.querySelectorAll('.tk.now').forEach(e=>{e.classList.remove('now');e.classList.add('done')});
  card.querySelectorAll('.ln.on').forEach(e=>e.classList.remove('on'));
  const el=$(`tk${li}-${ti}`),ln=$('ln'+li);if(el)el.classList.add('now');if(ln)ln.classList.add('on');
  bulbs.forEach((b,j)=>b.classList.toggle('hit',(j+i)%3===0));
  if(i===14)heartBurst(W/2,H*.28);else if(d>=1)rocket(R(W*.1,W*.9),R(H*.1,H*.42));
}
function finale(){
  bulbs.forEach(b=>b.classList.remove('hit'));
  card.querySelectorAll('.tk').forEach(e=>{e.classList.remove('now');e.classList.add('done')});
  for(let k=0;k<5;k++)setTimeout(()=>rocket(W*(.12+.19*k),R(H*.1,H*.3),k===2?'heart':null),k*170);
  setTimeout(()=>{rain(200);show(`<p class="big">${esc(NAME)}，生日快樂！</p><p>歌唱完了～換你把蠟燭點起來！</p>`);step2('點蠟燭','candle',lightUp)},1600);
}

/* screen 2: wish + blow candles */
const scene=$('scene'),flames=[...document.querySelectorAll('.flame')],glows=[...document.querySelectorAll('.fglow')],smokes=[...document.querySelectorAll('.smoke')];
const WISH_SEC=15;
function lightUp(){
  body.dataset.s='lighting';scene.classList.remove('out');
  show('<p class="big">點蠟燭囉</p><p>一根、兩根、三根……</p>');
  flames.forEach((f,i)=>setTimeout(()=>{f.classList.remove('out');glows[i].classList.remove('out');const[x,y]=center(glows[i]);sparkBurst(x,y,26,['#ffd27a','#fff1b8'],2.8);flash(x,y,40,'#ffd27a');tick(880+i*120)},300+i*450));
  setTimeout(wishTime,300+flames.length*450+700);
}
function wishTime(){
  body.dataset.s='wishing';
  show(`<p class="big">來許願吧！</p><p>眼睛閉起來，偷偷在心裡許，<br>慢慢想沒關係～</p><div class="bar"><i style="animation-duration:${WISH_SEC}s"></i></div>`);
  setTimeout(()=>{
    body.dataset.s='wish';
    show('<p class="big">許好了嗎？</p><p>好，一口氣把它吹熄！</p>');
    step2('吹熄蠟燭','candle',blow);
  },WISH_SEC*1000);
}
function blow(){
  wait();body.dataset.s='blowing';sWhoosh();
  flames.forEach((f,i)=>setTimeout(()=>{f.classList.add('out');glows[i].classList.add('out');smokes[i].classList.remove('on');smokes[i].getBoundingClientRect();smokes[i].classList.add('on')},i*80));
  scene.classList.add('out');
  setTimeout(()=>{dark=true;body.classList.add('dark')},350);
  show('<p class="big">噓……關燈了</p><p>你的願望正在飛上天</p>');
  setTimeout(shootingStar,1300);
  setTimeout(()=>{
    dark=false;body.classList.remove('dark');
    confetti(0,H,170,{angle:-Math.PI/3,spread:.7,speed:R(17,21)});confetti(W,H,170,{angle:-2*Math.PI/3,spread:.7,speed:R(17,21)});
    sPop();setTimeout(sPop,60);sChime();
    show(`<p class="big">願望送出去啦！</p><p>有看到剛剛那顆流星嗎？<br>它幫你把願望帶走了，一定會成真的啦！</p>`);
    step2('下一步','arrow',giftScreen);
  },3100);
}
$('cake').addEventListener('click',()=>{if(body.dataset.s==='wish'&&onNext)next.click()});

/* screen 3: gift */
/* 獎品清單：改這裡 */
const PRIZES=['一頓大餐（我請客）','一杯手搖飲，甜度冰塊隨你','一場電影，爆米花我買','一整天，都聽你的','一個超級大擁抱','下次出去玩，我當司機','許一個願望，我幫你實現','一張「不生氣卡」，限用一次'];
function giftScreen(){
  body.dataset.s='gift';
  show('<p class="big">接下來是抽獎時間！</p><p>我準備了好幾個獎品，但只能抽一個喔，<br>就看你手氣啦～</p>');
  step2('抽獎！','gift',openGift);
}
function openGift(){
  wait();body.dataset.s='opening';
  show('<p class="big">抽獎中……</p><div class="slot"><span id="slotT"></span></div>');
  const el=$('slotT'),win=Math.floor(Math.random()*PRIZES.length);
  let idx=Math.floor(Math.random()*PRIZES.length),delay=55;
  const total=PRIZES.length*3+((win-idx+PRIZES.length*9)%PRIZES.length); /* ends exactly on win */
  let n=0;
  const roll=()=>{
    el.textContent=PRIZES[idx];el.classList.remove('pop');el.getBoundingClientRect();el.classList.add('pop');tick(1100+(n%2)*220);
    if(n>=total){land();return}
    n++;idx=(idx+1)%PRIZES.length;
    if(n>total-10)delay*=1.28;
    setTimeout(roll,delay);
  };
  const land=()=>{
    $('card').querySelector('.slot').classList.add('won');
    setTimeout(()=>{
      sChime();sPop();setTimeout(sPop,90);
      const[x,y]=center($('card'));
      hearts(x,y,30);sparkBurst(x,y,80,['#ffd27a','#fff1e6','#ff9ab8'],6.5);flash(x,y,140,'#ffd27a');
      confetti(x,y,90,{angle:-Math.PI/2,spread:1.3,speed:13});
      confetti(0,H,120,{angle:-Math.PI/3,spread:.7,speed:R(17,21)});confetti(W,H,120,{angle:-2*Math.PI/3,spread:.7,speed:R(17,21)});
      show(`<p class="big">抽到了！恭喜恭喜～</p><div class="slot won"><span>${esc(PRIZES[win])}</span></div><p class="note">記得截圖，之後拿來找我兌換喔！</p>`);
      setTimeout(()=>step2('還有一封信','arrow',ending),1400);
    },500);
  };
  roll();
}

/* screen 4: the letter, stays until they leave */
const LETTER=['謝謝你一直都在，認識你真的是我賺到。','新的一歲，每天都要開開心心的喔！','想做的事都順順利利，想見的人都見得到。','不管幾歲，你都值得所有好東西，知道嗎？'];
function ending(){
  body.dataset.s='end';next.hidden=true;
  const n=LETTER.length;
  show(`<div class="letter"><p class="big">給 ${esc(NAME)}</p>${LETTER.map((t,i)=>`<p class="l" style="--d:${(.6+i*1.4).toFixed(1)}s">${t}</p>`).join('')}<p class="l sign" style="--d:${(.6+n*1.4+.4).toFixed(1)}s">生日快樂啦！</p></div>`);
  setTimeout(()=>{for(let k=0;k<5;k++)setTimeout(()=>rocket(W*(.12+.19*k),R(H*.1,H*.3),k===2?'heart':null),k*170);rain(220)},(.6+n*1.4+.4)*1000);
  setTimeout(function loop(){if(!document.hidden)rocket(R(W*.1,W*.9),R(H*.08,H*.35));setTimeout(loop,R(1800,3200))},(.6+n*1.4+3)*1000);
}

/* ---------- balloons ---------- */
const BL=$('balloons'),BC=['#ff7aa2','#ffd27a','#6fe3d0','#ff9a5a','#c9a0ff','#ff4f7e'];
const balloonSVG=c=>`<svg viewBox="0 0 70 160"><path d="M35 92q-7 14 2 26t-2 34" stroke="#ffffff88" stroke-width="1.4" fill="none"/><path d="M35 4C60 4 68 30 64 48C60 70 44 86 35 90C26 86 10 70 6 48C2 30 10 4 35 4Z" fill="${c}"/><path d="M35 4C60 4 68 30 64 48C60 70 44 86 35 90C44 76 54 56 52 38C50 20 44 8 35 4Z" fill="#000" opacity=".16"/><ellipse cx="22" cy="28" rx="7" ry="13" fill="#fff" opacity=".5" transform="rotate(-20 22 28)"/><circle cx="27" cy="48" r="2.5" fill="#fff" opacity=".4"/><path d="M30 93L40 93L35 87Z" fill="${c}"/></svg>`;
function spawnBalloon(initial){
  if(calm||BL.children.length>=(W<600?5:9))return;
  const b=document.createElement('div'),c=pick(BC),dur=R(16,26);
  b.className='balloon';b.dataset.c=c;
  b.style.cssText=`left:${R(-2,93).toFixed(1)}%;width:${R(52,82).toFixed(0)}px;animation-duration:${dur.toFixed(1)}s;${initial?`animation-delay:${(-R(.1,.75)*dur).toFixed(1)}s`:''}`;
  b.innerHTML=`<div style="animation-duration:${R(2.6,4).toFixed(2)}s">${balloonSVG(c)}</div>`;
  b.addEventListener('animationend',e=>{if(e.target===b)b.remove()});
  b.addEventListener('pointerdown',e=>{e.stopPropagation();const r=b.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.width*.6;
    sPop();confetti(x,y,36,{speed:7,cols:[c,'#fff1e6','#ffd27a']});sparkBurst(x,y,24,c,3.6);flash(x,y,50,c);b.remove()});
  BL.appendChild(b);
}

/* ---------- sky taps & cursor sparkles ---------- */
let lastTrail=0,lastTap=0;
addEventListener('pointermove',e=>{if(calm)return;const n=performance.now();if(n-lastTrail<26)return;lastTrail=n;
  add({k:'st',x:e.clientX,y:e.clientY,vx:R(-.6,.6),vy:R(-.4,.8),g:.03,rot:R(0,6),vr:R(-.1,.1),sz:R(2.5,5.5),col:pick(['#ffd27a','#fff1e6','#ff9ab8','#8ff0de']),life:40,max:40})},{passive:true});
addEventListener('pointerdown',e=>{if(e.target.closest('button,input,label,.balloon,.stage,.card,footer'))return;const n=performance.now();if(n-lastTap<200)return;lastTap=n;
  if(e.clientY>H*.78)explode(e.clientX,e.clientY,pick(FW),'peony');else rocket(e.clientX,e.clientY)});

/* ---------- start ---------- */
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{resize();buildLights()},150)});
resize();buildLights();
body.dataset.s='lock';body.classList.add('off');
const PASSWORD='1127',pw=$('pw'),lock=$('lock');
function tryPw(){
  if(pw.value.length<4)return;
  if(pw.value===PASSWORD){pw.blur();sChime();confetti(W/2,H*.45,90,{speed:10});sparkBurst(W/2,H*.45,50,['#ffd27a','#fff1e6'],5);body.dataset.s='intro'}
  else{$('pwMsg').textContent='密碼不對喔，再想想～';lock.classList.remove('err');lock.getBoundingClientRect();lock.classList.add('err');tick(330);setTimeout(()=>{pw.value=''},350)}
}
pw.addEventListener('input',()=>{pw.value=pw.value.replace(/\D/g,'');tryPw()});
pw.addEventListener('keydown',e=>{if(e.key==='Enter')tryPw()});
setTimeout(()=>{try{pw.focus({preventScroll:true})}catch(e){}},600);scene.classList.add('out');flames.forEach(f=>f.classList.add('out'));glows.forEach(g=>g.classList.add('out'));step2('打開驚喜','music',start);
requestAnimationFrame(frame);
for(let i=0;i<6;i++)spawnBalloon(true);
setInterval(()=>spawnBalloon(false),2600);
}
</script>
</body>
